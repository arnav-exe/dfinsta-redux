[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dfinsta-pipeline"
version = "0.1.0"
description = "Durable DFInsta porting pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "temporalio==1.30.0",
]

# Stage 5a only. Kept optional because everything else — resolve, apply, build,
# verify, the gates — must run with no model available at all, and because this
# one drives the `claude` CLI, which is an interactively-authenticated program
# and not something the deterministic spine may come to depend on.
# See docs/PROPOSER_RUNTIME.md.
[project.optional-dependencies]
proposers = [
  "claude-agent-sdk>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
