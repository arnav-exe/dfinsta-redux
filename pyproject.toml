[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dfinsta-pipeline"
version = "0.1.0"
description = "Durable DFInsta porting pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "temporalio==1.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]
